<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#161b22;#0d1117" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#161b22">
        <animate attributeName="stop-color" values="#161b22;#1f242d;#161b22" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#090d16">
        <animate attributeName="stop-color" values="#090d16;#0d1117;#090d16" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="50%" stop-color="#ff0080" />
      <stop offset="100%" stop-color="#00dfd8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2" />

  <!-- Animated Grid Pattern -->
  <g opacity="0.15">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" stroke="#8b949e" stroke-dasharray="4 4" />
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300" stroke="#8b949e" stroke-dasharray="4 4" />
  </g>

  <!-- Glowing Dynamic Nodes -->
  <g filter="url(#glow)">
    <circle cx="150" cy="80" r="4" fill="#38bdf8">
      <animate attributeName="r" values="3;7;3" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="220" r="5" fill="#ff0080">
      <animate attributeName="r" values="4;9;4" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="70" r="3" fill="#00dfd8">
      <animate attributeName="r" values="2;6;2" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Search Bar Visual Element -->
  <g transform="translate(300, 195)">
    <rect x="0" y="0" width="600" height="54" rx="27" fill="#161b22" stroke="url(#accentGrad)" stroke-width="2" />
    <path d="M24 17 A9 9 0 1 0 24 35 A9 9 0 1 0 24 17 Z M31 31 L39 39" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <text x="54" y="33" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Search docs, Jira, Slack, code &amp; knowledge base...
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </text>
    <rect x="460" y="10" width="128" height="34" rx="17" fill="url(#accentGrad)" />
    <text x="524" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">AI Search ✦</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="95" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" text-anchor="middle" letter-spacing="1.5">
    AWESOME WORKPLACE SEARCH PLATFORM
  </text>
  
  <text x="600" y="142" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" text-anchor="middle">
    🔍 Permission-Aware AI Search • Enterprise Knowledge Retrieval • Open-Source &amp; Commercial Solutions
  </text>
</svg>
